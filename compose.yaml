services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: advinhasong
      POSTGRES_PASSWORD: advinhasong
      POSTGRES_DB: advinhasong
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advinhasong -d advinhasong"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
